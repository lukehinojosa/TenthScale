name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install raylib dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Cache downloaded packages
        uses: actions/cache@v6
        with:
          path: .cpm-cache
          key: cpm-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --test-dir build/release --output-on-failure

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # The same Emscripten as tools/install-windows.ps1, so the published page matches local builds
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 5.0.4

      - name: Configure
        run: cmake --preset web

      - name: Build
        run: cmake --build --preset web

      # The game at the site's root and the sandbox at sandbox.html
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web/bin

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web/bin

  # Publishes the web build to GitHub Pages, only from main and only once both builds pass
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ desktop, web ]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
