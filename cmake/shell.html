<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CppTemplate</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #1e1e24;
            overflow: hidden;
        }
        canvas#canvas {
            display: block;
            outline: none;
        }
        #status {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ccc;
            font: 16px sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div id="status">Loading...</div>
<!-- tabindex lets the canvas take keyboard focus; the context menu would steal right-click -->
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<script>
    var canvas = document.getElementById('canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    canvas.focus();

    var Module = {
        canvas: canvas,
        setStatus: function (text) {
            var status = document.getElementById('status');
            status.textContent = text;
            status.style.display = text ? 'flex' : 'none';
        },
        print: function (text) { console.log(text); },
        printErr: function (text) { console.error(text); }
    };
</script>
{{{ SCRIPT }}}
</body>
</html>
